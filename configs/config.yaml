# =============================================================================
#                    FedCoFiT: Federated Co-Training Configuration
# =============================================================================
# 
# This is the main configuration file for FedCoFiT experiments.
# Modify the settings below to customize your experiment.
#
# Key concepts:
# - Clients: Distributed nodes with private data
# - Public Unlabeled Pool: Shared data for consensus-based pseudo-labeling
# - Semantic Consensus: DBSCAN clustering on response embeddings to find agreement
# - Rounds: Communication rounds between clients and server
#
# =============================================================================

# =============================================================================
# EXPERIMENT SETTINGS
# =============================================================================
experiment:
  name: fedcofit_experiment        # Experiment name for logging
  method: FedCoFiT                 # Method identifier (do not change)
  output_dir: results              # Directory for experiment outputs
  seed: 1337                       # Random seed for reproducibility

# =============================================================================
# HARDWARE & DISTRIBUTED SETTINGS
# =============================================================================
hardware:
  num_clients: 10                  # Number of federated clients (2-100)
  gpus: 5                          # Number of available GPUs
  clients_per_gpu: 2               # Clients sharing each GPU (memory-limited)
  # Note: clients_per_gpu = 2 means 2 clients run sequentially per GPU
  # Reduce to 1 for larger models (7B+) to avoid OOM

# =============================================================================
# MODEL SELECTION
# =============================================================================
# Choose ONE base model by uncommenting the appropriate line.
# Models are ordered by size (smaller = faster, less memory).

model:
  # --- TinyLlama 1.1B Models (fits on single GPU, fast training) ---
  # Recommended for initial experiments and testing
  base_model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  # base_model_name_or_path: TinyLlama/TinyLlama-1.1B-intermediate-step-1431k-3T  # Base model
  
  # --- LLaMA-2 7B Models (requires ~14GB+ VRAM, reduce clients_per_gpu to 1) ---
  # base_model_name_or_path: meta-llama/Llama-2-7b-hf        # Base model
  # base_model_name_or_path: meta-llama/Llama-2-7b-chat-hf  # Chat model
  
  # --- LLaMA-2 13B Models (requires ~28GB+ VRAM, set clients_per_gpu to 1) ---
  # base_model_name_or_path: NousResearch/Llama-2-13b-chat-hf  # Non-gated mirror
  
  # --- Mistral 7B (competitive with LLaMA-2 7B, needs ~14GB VRAM) ---
  # base_model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
  
  dtype: bf16                      # bf16 (default) | fp16 | fp32
  use_flash_attention_2: false     # Set true for LLaMA-2+ if FlashAttention2 installed
  max_seq_len: 512                 # Maximum sequence length (512-2048)

# =============================================================================
# LORA CONFIGURATION (Parameter-Efficient Fine-Tuning)
# =============================================================================
lora:
  r: 32                            # LoRA rank (8, 16, 32, 64)
  alpha: 32                        # LoRA alpha (typically same as r)
  dropout: 0.05                    # Dropout rate for regularization
  target_modules:                  # Which layers to adapt
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    # Uncomment below for more aggressive fine-tuning (higher memory):
    # - gate_proj
    # - up_proj
    # - down_proj

# =============================================================================
# TASK & DATASET SELECTION
# =============================================================================
# Supported datasets:
# - Instruction-following: dolly-15k, alpaca, wizardlm, openorca, sharegpt, ultrachat
# - Classification: sst2 (sentiment analysis)

task:
  # --- Instruction-Following Datasets ---
  name: dolly-15k                  # dolly-15k | alpaca | wizardlm | openorca | sharegpt | ultrachat
  type: instruction                # instruction | classification
  
  # --- Classification Datasets ---
  # name: sst2                     # SST-2 sentiment classification
  # type: classification

# =============================================================================
# DATA PARTITIONING (Federated Split)
# =============================================================================
data:
  split:
    type: iid                      # iid (uniform) | dirichlet (non-iid)
    dirichlet_alpha: 0.5           # Lower = more heterogeneous (0.1-1.0)
    client_val_ratio: 0.05         # Fraction for client-local validation
  
  # Public Unlabeled Pool (for consensus-based pseudo-labeling)
  public_unlabeled:
    dp_total_size: 500             # Total pool size (samples from training data)
    dp_samples_per_round: 50       # Samples used per round
    deterministic_round_sampling: true  # Reproducible sampling

# =============================================================================
# TRAINING HYPERPARAMETERS
# =============================================================================
training:
  micro_batch_size: 16             # Batch size per forward pass
  grad_accum_steps: 8              # Gradient accumulation (effective batch = 16 × 8 = 128)
  learning_rate: 0.0003            # AdamW learning rate (1e-4 to 5e-4 typical)
  warmup_ratio: 0.03               # Fraction of steps for LR warmup

# =============================================================================
# EXPERT PHASE (Initial Local Training)
# =============================================================================
expert:
  expert_epochs: 0                 # Epochs of private training before federation (0-3)
  save_dir: checkpoints            # Directory for saving checkpoints

# =============================================================================
# FEDERATED LEARNING SETTINGS
# =============================================================================
federated:
  rounds: 3                        # Number of communication rounds (1-10)
  
  # Training mode: Choose ONE of the following:
  
  # Option 1: Fixed steps (recommended for fair comparison)
  local_steps: 12                  # Fixed optimizer steps per round
  
  # Option 2: Epochs (alternative)
  # local_epochs: 1                # Epochs through combined data per round
  
  pseudo_buffer_max: 50            # Max pseudo-labeled samples to keep
  mix_private_ratio: 0.7           # Fraction of private vs pseudo data (0.5-1.0)
                                   # 0.7 = 70% private, 30% pseudo-labeled

# =============================================================================
# GENERATION SETTINGS (For producing responses to unlabeled data)
# =============================================================================
generation:
  temperature: 0.0                 # 0.0 = greedy, >0 = sampling
  do_sample: false                 # true for temperature sampling
  max_new_tokens: 128              # Max tokens to generate (64-256 for instructions)
  batch_size: 8                    # Generation batch size
  repetition_penalty: 1.15         # Penalty for repeating tokens (1.0-1.3)
  retry_once_with_strict_prompt: false  # For classification tasks

# =============================================================================
# SERVER SETTINGS (Semantic Consensus)
# =============================================================================
server:
  # Communication mode:
  # - "text": Clients send text responses, server computes embeddings (lower bandwidth)
  # - "embeddings": Clients compute & send embeddings (faster aggregation)
  send_mode: text
  
  # Sentence embedding model for semantic similarity
  embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
  embedding_device: cpu            # cpu | cuda:0
  embedding_dtype_for_comm: float16
  
  # DBSCAN clustering for consensus
  dbscan:
    eps: 0.25                      # Similarity threshold (0.1-0.5; higher = looser)
    min_samples: 3                 # Minimum clients to form a cluster
    metric: cosine                 # Distance metric

# =============================================================================
# NETWORK SIMULATION (Optional)
# =============================================================================
network:
  simulate_latency: true          # Simulate network delays
  bandwidth_mbps: 10               # Simulated bandwidth (Mbps)

# =============================================================================
# LOGGING SETTINGS
# =============================================================================
logging:
  log_level: info                  # debug | info | warning | error
  write_resolved_config: true      # Save resolved config to output dir
  track_energy: true               # Track energy consumption (if available)

# =============================================================================
# EVALUATION SETTINGS
# =============================================================================
evaluation:
  # Per-round evaluation (on client's own training data)
  per_round:
    max_samples: 300               # Max samples for per-round eval
  
  # 1. Held-Out Test Set (Response-token NLL/Perplexity)
  held_out:
    enabled: false                 # Enable held-out evaluation
    test_ratio: 0.1                # Fraction held out
    max_samples: 500               # Max samples to evaluate
  
  # 2. IFEval - Instruction Following Evaluation
  ifeval:
    enabled: true                  # Enable IFEval benchmark
    sample_ratio: 1.0              # Fraction of IFEval to use
    max_samples: 500               # Max samples (for speed)
  
  # 3. MMLU - Multiple Choice Knowledge Test
  mmlu:
    enabled: false                 # Enable MMLU benchmark
    sample_ratio: 1.0              # Fraction of MMLU to use
    num_shots: 5                   # Few-shot examples (0, 3, or 5)
    eval_clients: all              # all | first | [0, 5, 9]
  
  # 4. MT-Bench - Conversational Ability (requires GPT-4 for proper scoring)
  mtbench:
    enabled: false                 # Enable MT-Bench
    save_responses: true           # Save responses for GPT-4 judging
  
  # Which clients run final evaluation
  # For FedCoFiT (personalized models): "all" recommended
  final_eval_clients: all          # all | first | [0, 5, 9]
